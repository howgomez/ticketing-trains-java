server:
  port: 8080

spring:
  application:
    name: ticketing-trains-boot

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
